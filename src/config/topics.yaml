topics:
  # story: ストーリー台帳（継続する話題の追跡）の対象にするか。既定 false。
  # 2026-08-11 のバックフィル実測で、トピックによって「続報が積み上がるか」が大きく違った。
  #   最大ストーリーの占有率 / 1記事だけのストーリー比率
  #   jp_politics 21% / 72%  → 成立する（皇位継承の論点提示→骨子案→閣議決定→国会提出が1本に繋がった）
  #   ai          22% / 68%  → 成立する
  #   game        51% / 67%  → 受け皿化。1本に無関係な新作情報が吸い込まれた
  #   finance     65% / 58%  → 「話題」でなく定点観測（日経平均・NISA）。日々の値動きに続報の構造がない
  #   paper       8%  / 93%  → arXiv論文は継続報道されない
  # これは「game と finance に流れが無い」という主張ではなく、いまのトピック粒度では
  # ストーリーとして成立しないという判断。トピックを細分化すれば将来また true にできる。
  # story: false のトピックも紙面には従来どおり載る（台帳に載らないだけ）。
  # maxItems: 1回の紙面に載せる最大件数。未指定時は8件。
  - id: ai
    label: AI企業・業界
    story: true
    # ai_oss / ai_model を増やしても紙面全体が急増しないよう、AI系3枠で最大12件に抑える。
    # 既存枠は実測の87%を占める企業動向・報道なので6件、新規の観測枠は各3件。
    maxItems: 6
    # webSearch補強は2週間観測（6/22-7/3実測）で良質な純寄与0のため無効化（2026-07-03）。
    # 供給はfetch（Google News/RSS）が鮮度・質とも上位互換。再有効化は webSearch: true を戻すだけ。
    keywords: [Claude, GPT, Gemini, LLM, 生成AI]
    urls:
      - https://www.anthropic.com/news
      - https://openai.com/news/rss.xml
      # 一次情報が Anthropic と OpenAI の2社だけだと「業界」ではなく「2社」を見ることになる。
      # DeepMind を足して研究・実装側の視野を広げる（2026-08-13 到達確認: 10件・当日更新）
      - https://deepmind.google/blog/rss.xml
    # research-hub（HN/arXiv/GitHub/RSS）による補強。ENABLE_RESEARCH_HUB=true のときだけ効く。
    # 切ったweb_search補強の無料リプレースとして、まずこのトピック1本で純寄与を観測する（2026-08-06〜）。
    # queries は keywords と別立て: HN検索(Algolia)は語をANDで扱うため、1語ずつ投げないと0件になる。
    research:
      search:
        queries: [Claude, OpenAI, Gemini, LLM]
        sources: [hackernews]
        since: 2d
        limit: 3

  # 実装・ツール・推論ランタイム。収集源は #22 で足し、#24 の手順で2週間観測する。
  # 観測期間中はストーリー台帳に入れず、継続する話題として成立するかを先に測る。
  - id: ai_oss
    label: AI OSS・実装
    story: false
    maxItems: 3
    keywords: []
    urls: []
    # 2026-08-18〜、2週間の観測枠（#22）。通常のニュース検索では上がらない
    # 実装レイヤを、HNの具体語検索とGitHubの急成長リポジトリから拾う。
    # releases.atom はrc・パッチ版が毎日流れるため、観測で不足すると分かるまで足さない。
    research:
      search:
        queries: [vLLM, MCP, agent framework]
        sources: [hackernews]
        since: 7d
        limit: 3
      trending:
        - source: github
          category: python
          period: week
          limit: 5

  # モデルのリリースと性能。収集源は #23 で足し、#24 の手順で2週間観測する。
  - id: ai_model
    label: AIモデル
    story: false
    maxItems: 3
    keywords: []
    urls: []
    # 2026-08-18〜、2週間の観測枠（#23）。公式ブログ/RSSが機能していない組織を、
    # モデル公開場所そのものであるHugging Face公式Organizationから追う。
    # 量子化・形式違いはbase_modelタグ等で1系列に畳み、直近7日の更新だけを渡す。
    research:
      huggingFace:
        authors: [Qwen, deepseek-ai, zai-org, moonshotai, MiniMaxAI]
        limitPerAuthor: 5
        sinceDays: 7
        maxItems: 12

  - id: finance
    label: 金融・投資
    keywords: [日経平均, S&P500, NISA, 投資信託]
    # 投資ニュースはkeywords由来のGoogle News検索で取得。
    # nikkei.com/markets は市況数値のみで記事見出しが取れず採用実績ゼロのため除外（2026-06-19監査）
    urls: []

  - id: game
    label: ゲーム・Nintendo
    keywords: [Nintendo, Switch, ゲーム新作]
    # ゲームニュースはkeywords由来のGoogle News検索で取得。
    # nintendo.co.jp/news はJS必須で本文取得不可（113字の空ページ）のため除外（2026-06-19監査）
    urls: []

  - id: paper
    label: AI論文
    keywords: []
    urls:
      - https://rss.arxiv.org/rss/cs.CL
      - https://rss.arxiv.org/rss/cs.AI

  - id: jp_politics
    label: 政治・行政
    story: true
    keywords: [政治, 政策, 内閣, 官邸, 法案, 省庁, デジタル庁]
    urls:
      - https://www3.nhk.or.jp/rss/news/cat4.xml
      - https://www.kantei.go.jp/index-jnews.rdf
      - https://www.digital.go.jp/rss/news.xml
      # パブリックコメント。「案→意見募集→結果公示」という段階を持つ一次情報で、
      # 法案が国会に出る前の段階を拾える唯一の口。ただし全省庁の全案件が流れるので
      # ヒット率は低い（2026-08-13 の実測10件は土地区画整理法・ワシントン条約・鉄道運賃など）。
      # RESCUE_MIN_SCORE が無いとこれが毎日1件ずつ紙面に載るので、セットで入れること
      - https://public-comment.e-gov.go.jp/rss/pcm_list.xml

  # AI・デジタルの「ルール側」。段階（規則案→施行→執行）を持つので台帳と相性が良い。
  # 2026-08-13 に候補を全部叩いて選んだ。落とした先と理由:
  #   NIST news            AIフィルタ(?topics=)が効かず、実測10件中AI関連は1件。残りはナノテク・量子・繊維
  #   Federal Register     全文検索しか無く、"artificial intelligence" が本文にかすった無関係な規則が大半
  #   UK AI Safety Institute  フィードは生きているが最新が2025-01-29で1年半以上停止
  #   経済産業省 whatsnew.rdf  403（Mozilla UAでも拒否）
  #   総務省 news.rdf      Shift_JIS で、いまの axios は UTF-8 前提のため文字化けする
  #   artificialintelligenceact.eu  更新はあるが解説サイトで論説寄り。一次情報ではないため見送り
  - id: ai_policy
    label: AI・デジタル規制
    story: true
    # Google News 検索は付けない。ここは一次情報だけを見る枠にする（報道は ai / jp_politics 側で拾える）
    keywords: []
    urls:
      # 欧州委員会。AI Act の施行・透明性ガイドライン・DSA の制裁がここから出る。
      # AI以外（域内メディア支援・人材育成）も流れるが、スコアで落ちる
      - https://digital-strategy.ec.europa.eu/en/rss.xml
