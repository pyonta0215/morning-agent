<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbfaf6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="朝刊便">
<link rel="manifest" href="/paper/manifest.webmanifest">
<link rel="icon" href="/paper/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/paper/apple-touch-icon.png">
<title>朝刊エージェント便 ／ 紙面</title>
<style>
  :root {
    --ink: #14110e; --sub: #55504a; --mute: #9b948c; --line: #d9d4cb;
    --accent: #a81a12; --bg: #efece5; --paper: #fbfaf6;
    --accent-soft: #f5e8e5; --surface: #fff; --surface-muted: #f3f0e9;
    --shadow-sm: 0 2px 10px rgba(39,31,24,.055); --radius: 12px;
    --mincho: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
    --gothic: "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--gothic); line-height: 1.75; font-feature-settings: "palt";
    -webkit-text-size-adjust: 100%;
  }
  a { color: inherit; }
  button, input, summary { -webkit-tap-highlight-color: transparent; }
  button, summary { touch-action: manipulation; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (hover: hover) {
    button:hover, summary:hover { border-color: #bcb4a9; }
    .filter-group button:hover, .field-sort button:hover, .filter-unread:hover { color: var(--accent); border-color: #d6aaa6; }
  }
  @media (prefers-reduced-motion: no-preference) {
    button, summary, .article-actions a { transition: background-color .16s ease, border-color .16s ease, color .16s ease, transform .12s ease; }
  }
  .sheet {
    max-width: 1080px; margin: 0 auto; background: var(--paper);
    border-left: 1px solid var(--line); border-right: 1px solid var(--line);
    padding: 22px 28px 70px; min-height: 100vh;
  }
  @media (max-width: 640px) { .sheet { padding: 16px 14px 48px; border: 0; } }

  /* ── 題字 ── */
  .masthead { text-align: center; border-bottom: 3px double var(--ink); padding-bottom: 8px; }
  .masthead .name {
    font-family: var(--mincho); font-size: clamp(19px, 5vw, 29px); font-weight: 700;
    letter-spacing: .3em; text-indent: .3em; line-height: 1.3; margin: 0;
  }
  .masthead .sub { font-size: 10px; color: var(--mute); letter-spacing: .3em; margin-top: 3px; }
  .colophon {
    display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    font-size: 10.5px; color: var(--sub); letter-spacing: .08em;
    padding: 5px 2px; border-bottom: 1px solid var(--ink);
  }
  .auth-action {
    border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--sub);
    padding: 0; font: inherit; letter-spacing: .08em; cursor: pointer;
  }
  .auth-action:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .err .retry {
    display: block; margin-top: 12px; border: 1px solid var(--accent); background: transparent;
    color: var(--accent); padding: 7px 12px; font: inherit; cursor: pointer;
  }

  /* ── タブ ── */
  .tabs { display: flex; flex-wrap: wrap; align-items: flex-end; border-bottom: 2px solid var(--ink); margin-top: 14px; }
  .tabs button {
    font-family: var(--mincho); font-size: 13.5px; letter-spacing: .22em; text-indent: .22em;
    padding: 7px 20px; margin: 0 3px 0 0; cursor: pointer;
    background: #e8e5de; color: var(--sub);
    border: 1px solid var(--line); border-bottom: 0; border-radius: 5px 5px 0 0;
  }
  .tab-icon { display: none; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tabs .search { margin-left: auto; padding: 0 0 5px; }
  .tabs input {
    font-family: var(--gothic); font-size: 12.5px; padding: 5px 10px; width: 210px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 0;
  }
  .tabs .search-tab { display: none; }
  @media (max-width: 640px) { .tabs .search { margin: 8px 0 0; width: 100%; } .tabs input { width: 100%; } }

  h2.sec {
    font-family: var(--mincho); font-size: 12.5px; font-weight: 700; letter-spacing: .3em;
    border-bottom: 1px solid var(--ink); padding-bottom: 4px; margin: 26px 0 12px;
    display: flex; align-items: baseline; gap: 10px;
  }
  h2.sec small { font-family: var(--gothic); font-size: 10px; letter-spacing: 0; color: var(--mute); font-weight: 400; }

  /* ── 一面 ── */
  .front { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 0 28px; margin-top: 18px; }
  .front > .side { border-left: 1px solid var(--line); padding-left: 28px; }
  @media (max-width: 860px) { .front { grid-template-columns: 1fr; }
    .front > .side { border-left: 0; padding-left: 0; margin-top: 26px; } }

  .kicker { display: inline-block; background: var(--accent); color: #fff;
    font-size: 10.5px; font-weight: 700; letter-spacing: .2em; padding: 3px 10px; }
  .lead-title {
    font-family: var(--mincho); font-size: clamp(21px, 3.4vw, 29px); font-weight: 700;
    line-height: 1.34; margin: 9px 0 8px;
  }
  /* #33: 話題選択後にここへフォーカスを移す。キーボード操作でも選択結果の位置が分かるように残す */
  .lead-title:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .lead-meta {
    font-size: 11px; color: var(--sub); letter-spacing: .06em; display: flex; gap: 16px; flex-wrap: wrap;
    border-top: 1px solid var(--ink); border-bottom: 1px solid var(--line); padding: 6px 0; margin-bottom: 16px;
  }
  .lead-meta b { color: var(--accent); }

  /* ── 話題詳細の3層（#34: 今回の更新 → ここまでの経過 → 根拠記事） ── */
  .latest-block { margin: 0 0 18px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .latest-label { display: inline-block; background: var(--accent); color: #fff;
    font-size: 10.5px; font-weight: 700; letter-spacing: .2em; padding: 3px 10px; margin-bottom: 8px; }
  .latest-date { display: block; font-size: 11px; color: var(--mute); letter-spacing: .06em; margin-top: 2px; }
  .latest-title { display: block; font-family: var(--mincho); font-size: 17px; font-weight: 700;
    line-height: 1.5; margin-top: 5px; text-decoration: none; border-bottom: 1px solid #cdc7bd; }
  .latest-title:hover { border-bottom-color: var(--accent); }
  .latest-block .read .latest-title { opacity: .58; }
  .latest-summary { font-size: 13px; color: var(--sub); line-height: 1.75; margin: 8px 0 0; }

  .storyline { list-style: none; margin: 0 0 20px; padding: 0; display: flex; border-top: 1px solid var(--line); }
  .storyline li { flex: 1; min-width: 0; padding: 10px 12px 0 0; border-right: 1px solid var(--line); }
  .storyline li:last-child { padding-right: 0; border-right: 0; }
  .storyline li.read .sl-title { opacity: .58; }
  .sl-label { display: block; font-size: 10px; color: var(--accent); font-weight: 700; letter-spacing: .14em; }
  .sl-date { display: block; font-size: 10px; color: var(--mute); margin-top: 3px; }
  .sl-title { display: block; font-family: var(--mincho); font-size: 13px; line-height: 1.5; margin-top: 4px;
    text-decoration: none; border-bottom: 1px solid #cdc7bd; }
  .sl-title:hover { border-bottom-color: var(--accent); }

  .evidence-heading { font-family: var(--mincho); font-size: 11.5px; font-weight: 700; letter-spacing: .2em;
    color: var(--sub); margin: 0 0 10px; }
  .evidence-heading small { font-family: var(--gothic); font-size: 10px; letter-spacing: 0; color: var(--mute); font-weight: 400; }

  .tl { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid var(--line); }
  .tl li { position: relative; padding: 0 0 14px 16px; font-family: var(--mincho); font-size: 14px; line-height: 1.6; }
  .tl li::before {
    content: ""; position: absolute; left: -24px; top: 9px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--accent); border: 2px solid var(--paper);
  }
  .tl li.dim::before { background: #b9b2a8; }
  .tl .d { display: block; font-family: var(--gothic); font-size: 10px; color: var(--mute); letter-spacing: .18em; }
  .tl .sm { display: block; font-family: var(--gothic); font-size: 11.5px; color: var(--sub); line-height: 1.6; margin-top: 2px; }
  .tl a { text-decoration: none; border-bottom: 1px solid #cdc7bd; }
  .tl a:hover { border-bottom-color: var(--accent); }

  /* ── きょう動いた話題 ── */
  .moved { list-style: none; margin: 0; padding: 0; }
  .moved li { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .moved li[data-story] { cursor: pointer; }
  .moved b { display: block; font-family: var(--mincho); font-size: 14px; line-height: 1.5; font-weight: 700; }
  .moved .note { font-size: 10.5px; color: var(--mute); letter-spacing: .04em; }
  .badge { display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: .12em;
    padding: 2px 7px; margin-bottom: 5px; }
  .b-new { background: var(--accent); color: #fff; }
  .b-cont { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .b-end { background: #eae7e0; color: #6d675f; border: 1px solid var(--line); }

  /* ── 今朝の要点 ── */
  .highlights { list-style: none; margin: 0 0 24px; padding: 0; }
  .highlights .highlight { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .highlights .highlight[data-story] { cursor: pointer; }
  .highlights .h-title {
    display: block; font-family: var(--mincho); font-size: 15px; font-weight: 700;
    line-height: 1.5; margin-top: 3px;
  }
  .highlights .highlight.lead { padding-top: 2px; }
  .highlights .highlight.lead .h-title { font-size: clamp(19px, 2.6vw, 24px); line-height: 1.4; margin-top: 7px; }
  .highlights .h-summary { font-size: 12.5px; color: var(--sub); line-height: 1.7; margin: 7px 0 0; }
  .highlights .h-meta {
    font-size: 11px; color: var(--sub); letter-spacing: .06em; display: flex; gap: 16px;
    flex-wrap: wrap; margin-top: 7px;
  }
  .highlights .h-meta b { color: var(--accent); }
  .highlights-empty { font-size: 12.5px; color: var(--mute); padding: 10px 0; border-bottom: 1px solid var(--line); }
  .story-detail { margin-top: 2px; }

  /* ── 経過表 ── */
  .gantt { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .gantt th {
    font-size: 9.5px; color: var(--mute); font-weight: 400; text-align: left;
    letter-spacing: .14em; padding: 0 8px 5px 0; border-bottom: 1px solid var(--ink);
  }
  .gantt td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .gantt tbody tr { cursor: pointer; }
  .gantt tbody tr:hover { background: #f3efe8; }
  .gantt tbody tr[aria-selected="true"] { background: #f6ece9; }
  .gantt td.t { font-family: var(--mincho); font-size: 13.5px; line-height: 1.45; }
  .gantt td.t em { display: block; font-family: var(--gothic); font-style: normal;
    font-size: 10px; color: var(--mute); letter-spacing: .04em; margin-top: 2px; }
  .gantt td.n { text-align: right; font-size: 12px; color: var(--sub); white-space: nowrap; }
  .track { position: relative; height: 14px; }
  .track::after { content: ""; position: absolute; left: 0; right: 0; top: 6.5px; height: 1px; background: #e6e2da; }
  .bar { position: absolute; top: 5.5px; height: 3px; background: #c2bab0; }
  .bar.live { background: #e2a49f; }
  .tick { position: absolute; top: 3.5px; width: 7px; height: 7px; border-radius: 50%; background: #6f6860; }
  .tick.live { background: var(--accent); }
  .kind { font-size: 9.5px; font-weight: 700; padding: 2px 6px; letter-spacing: .06em; white-space: nowrap; }
  .k-steady { background: var(--accent); color: #fff; }
  .k-developing { background: #f6ead2; color: #8a6410; border: 1px solid #e3d2ab; }
  .k-spike { background: var(--ink); color: #fff; }
  .k-unknown { background: #eae7e0; color: #5c564e; border: 1px solid var(--line); }
  .long { font-size: 9px; color: var(--accent); letter-spacing: .1em; margin-left: 5px; }
  @media (max-width: 640px) { .gantt col.c-track, .gantt th.h-track, .gantt td.c-track { display: none; } }
  /* #33: 今日動きのない話題は折りたたみ、今日動いたものだけを先に見せる */
  .gantt-dormant { margin-top: 14px; }
  .gantt-dormant > summary {
    min-height: 44px; display: flex; align-items: center; gap: 6px; cursor: pointer;
    font-size: 12.5px; color: var(--sub); list-style: none;
  }
  .gantt-dormant > summary::-webkit-details-marker { display: none; }
  .gantt-dormant > summary::before { content: "⌄"; color: var(--mute); font-size: 15px; }
  .gantt-dormant[open] > summary::before { content: "⌃"; }
  .gantt-dormant .gantt { margin-top: 10px; }

  /* ── 記事リスト ── */
  .arts { list-style: none; margin: 0; padding: 0; }
  .arts li { padding: 11px 0; border-bottom: 1px solid var(--line); }
  .arts .h { font-family: var(--mincho); font-size: 14.5px; line-height: 1.5; }
  .arts .h a { text-decoration: none; border-bottom: 1px solid #cdc7bd; }
  .arts .h a:hover { border-bottom-color: var(--accent); }
  .arts .s { font-size: 12px; color: var(--sub); line-height: 1.7; margin-top: 3px; }
  .arts .m { font-size: 10px; color: var(--mute); letter-spacing: .1em; margin-top: 4px; }
  .arts .m .tp { color: var(--accent); font-weight: 700; margin-right: 8px; }
  .arts .m .src { color: var(--sub); font-weight: 700; margin-right: 8px; }
  .arts li.read { opacity: .58; }
  .arts li.read .h::before { content: "既読"; font-family: var(--gothic); font-size: 9px; color: var(--mute); margin-right: 7px; }
  .b-solo { background: #eae7e0; color: #6d675f; border: 1px solid var(--line); }
  .art-story { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
  .art-story-title { font-size: 11px; color: var(--sub); letter-spacing: .04em; }
  .art-story-note { font-size: 10px; color: var(--mute); letter-spacing: .04em; }
  /* #33: 「今日」画面は要約（＝今回の更新）を開閉なしで常時見せる */
  .art-preview { margin: 6px 0 0; font-size: 12px; color: var(--sub); line-height: 1.7; }

  /* ── 検索結果（#36: 話題単位のグループ＋分野・期間・状態フィルター） ── */
  .search-filters { display: flex; flex-wrap: wrap; gap: 10px 16px; margin: 4px 0 18px; }
  .filter-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-label { flex: 0 0 100%; font-size: 10px; font-weight: 700; color: var(--mute); letter-spacing: .12em; }
  .filter-group button {
    min-height: 34px; padding: 5px 11px; border: 1px solid var(--line); background: #fff;
    color: var(--sub); font: 11.5px var(--gothic); cursor: pointer; border-radius: 999px;
  }
  .filter-group button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .search-groups { list-style: none; margin: 0; padding: 0; }
  .search-groups .search-group { padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .sg-title { display: block; font-family: var(--mincho); font-size: 14.5px; font-weight: 700; line-height: 1.5; margin-top: 4px; }
  .sg-meta { font-size: 10.5px; color: var(--sub); letter-spacing: .06em; margin-top: 4px; }
  .sg-sample { font-size: 11.5px; color: var(--mute); margin-top: 4px; }
  .search-solo-heading { font-family: var(--mincho); font-size: 11.5px; font-weight: 700; letter-spacing: .2em;
    color: var(--sub); margin: 22px 0 10px; }
  .search-solo-heading small { font-family: var(--gothic); font-size: 10px; letter-spacing: 0; color: var(--mute); font-weight: 400; }
  mark { background: #f6d9c8; color: var(--ink); padding: 0 1px; }

  .article-detail { margin-top: 10px; }
  .article-detail > summary {
    width: max-content; min-height: 40px; margin-left: auto; padding: 7px 10px;
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    color: var(--ink); background: #f3f0e9; border: 1px solid var(--line);
    font-size: 12px; font-weight: 700; list-style: none;
  }
  .article-detail > summary::-webkit-details-marker { display: none; }
  .article-detail > summary::before {
    content: "要"; display: grid; place-items: center; width: 24px; height: 24px; flex: 0 0 auto;
    background: var(--ink); color: #fff; font-family: var(--mincho); font-size: 12px;
  }
  .article-detail > summary::after { content: "⌄"; margin-left: auto; color: var(--sub); font-size: 16px; line-height: 1; }
  .article-detail[open] > summary::after { content: "⌃"; }
  .article-detail .summary-state { margin-left: 2px; color: var(--mute); font-size: 10px; font-weight: 400; }
  .article-detail .when-open { display: none; }
  .article-detail[open] .when-closed { display: none; }
  .article-detail[open] .when-open { display: inline; }
  .article-detail[open] > summary { background: #ebe7df; border-color: #c9c3b9; }
  .summary-body { margin-top: 6px; padding: 11px 12px; border: 1px solid var(--line); background: #f3f0e9; }
  .article-detail .s { margin: 0; color: var(--ink); }
  .article-actions { margin-top: 8px; }
  .article-actions a { color: var(--accent); font-size: 12px; font-weight: 700; text-decoration: none; }
  .list-tools { display: flex; justify-content: flex-end; margin: -2px 0 4px; }
  .filter-unread {
    min-height: 38px; padding: 6px 11px; border: 1px solid var(--line); background: #fff;
    color: var(--sub); font: 12px var(--gothic); cursor: pointer; border-radius: 999px;
  }
  .filter-unread[aria-pressed="true"] { color: #fff; background: var(--accent); border-color: var(--accent); }
  .subnav-action { display: none; }
  .unread-dot { display: inline-block; width: 7px; height: 7px; margin: 0 7px 1px 0; border-radius: 50%; background: var(--accent); }
  .today-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 22px; }
  .today-summary button { padding: 11px; border: 1px solid var(--line); background: #fff; color: var(--sub); text-align: left; cursor: pointer; font: 11px var(--gothic); }
  .today-summary b { display: block; margin-top: 2px; color: var(--ink); font-family: var(--mincho); font-size: 20px; }

  .daybar { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
  .daybar button {
    font-family: var(--gothic); font-size: 11px; padding: 4px 9px; cursor: pointer;
    background: #fff; border: 1px solid var(--line); color: var(--sub); border-radius: 999px;
  }
  .daybar button[aria-selected="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .monthbar { margin-bottom: 10px; }
  .monthbar button { font-family: var(--mincho); font-size: 12.5px; letter-spacing: .08em; padding: 5px 13px; }
  .monthbar button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); }

  /* ── 分野の動向（#35） ── */
  .field-sort { display: flex; gap: 8px; margin: 14px 0 4px; }
  .field-sort button {
    min-height: 36px; padding: 6px 13px; border: 1px solid var(--line); background: #fff;
    color: var(--sub); font: 12px var(--gothic); cursor: pointer; border-radius: 999px;
  }
  .field-sort button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .fields { list-style: none; margin: 0; padding: 0; }
  .fields .field { padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .field-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .field-label { font-family: var(--mincho); font-size: 14.5px; font-weight: 700; }
  .field-trend { font-size: 12px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
  .field-trend.trend-up { color: var(--accent); }
  .field-trend.trend-down { color: var(--sub); }
  .field-trend.trend-flat { color: var(--mute); }
  .field-numbers { font-size: 11px; color: var(--sub); letter-spacing: .04em; margin-top: 4px; }
  .field-numbers b { color: var(--ink); }
  .sparkline { display: flex; align-items: flex-end; gap: 3px; height: 26px; margin-top: 9px; }
  .spark-bar { display: inline-block; width: 9px; background: #c2bab0; }
  .spark-bar.spark-now { background: var(--accent); }

  .muted { font-size: 12.5px; color: var(--mute); padding: 18px 0; }
  .err { font-size: 13px; color: var(--accent); padding: 24px 0; }
  [hidden] { display: none !important; }

  @media (max-width: 640px) {
    body { padding-bottom: calc(78px + env(safe-area-inset-bottom)); background: var(--paper); line-height: 1.65; }
    .sheet { padding: 12px 16px 38px; }
    .masthead { text-align: left; border-bottom: 0; padding: 3px 0 7px; }

<script>
/** 2つの ISO 日付（YYYY-MM-DD）の日数差。JST 固定で正午基準にし、DST 等の揺れを避ける */
function dayDiff(a, b) {
  return Math.round((Date.parse(b + 'T00:00:00+09:00') - Date.parse(a + 'T00:00:00+09:00')) / 864e5);
}

/**
 * 「今朝の要点」候補を today 動いた話題（新規・続報）から抽出し、決定的に順位付けする。
 * DOM に触れない純粋関数。固定データでのテストは highlights.test.mjs を参照。
 *
 * 順位は Issue #31 が指定する4要素をこの優先順位でチェーン比較する:
 * 当日の記事重要度 → 複数ソース → 既存話題の再始動間隔 → 記事数。
 * 全て同点の場合だけ id 昇順で決める（結果を一意にするための最終手段）。
 */
function selectMorningHighlights(stories, articles, lastDate) {
  var articleById = {};
  articles.forEach(function (a) { articleById[a.id] = a; });

  var candidates = [];
  stories.forEach(function (s) {
    var isNew = s.firstSeen === lastDate;
    var isContinued = !isNew && s.dates.indexOf(lastDate) !== -1;
    if (!isNew && !isContinued) return;

    var todayArticles = s.articleIds
      .map(function (id) { return articleById[id]; })
      .filter(function (a) { return a && a.date === lastDate; });
    if (!todayArticles.length) return;

    var todayScore = todayArticles.reduce(function (max, a) { return Math.max(max, a.score); }, 0);
    var sources = {};
    todayArticles.forEach(function (a) { if (a.sourceName) sources[a.sourceName] = true; });
    var multiSource = Object.keys(sources).length >= 2;

    var reactivationGapDays = 0;
    if (isContinued) {
      var pastDates = s.dates.filter(function (d) { return d !== lastDate; });
      if (pastDates.length) reactivationGapDays = dayDiff(pastDates[pastDates.length - 1], lastDate);
    }

    var lead = todayArticles.slice().sort(function (a, b) { return b.score - a.score; })[0];

    candidates.push({
      id: s.id,
      title: s.title,
      topic: s.topic,
      status: isNew ? '新規' : '続報',
      todayScore: todayScore,
      multiSource: multiSource,
      reactivationGapDays: reactivationGapDays,
      count: s.count,
      summary: lead ? lead.summary : ''
    });
  });

  candidates.sort(function (a, b) {
    if (a.todayScore !== b.todayScore) return b.todayScore - a.todayScore;
    if (a.multiSource !== b.multiSource) return (b.multiSource ? 1 : 0) - (a.multiSource ? 1 : 0);
    if (a.reactivationGapDays !== b.reactivationGapDays) return b.reactivationGapDays - a.reactivationGapDays;
    if (a.count !== b.count) return b.count - a.count;
    return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
  });

  return candidates.slice(0, 3);
}

/**
 * 今日の記事を「新規」「続報」「単発（話題化されていない記事）」へ一度だけ分類する。
 * DOM に触れない純粋関数。固定データでのテストは today-groups.test.mjs を参照。
 *
 * - 新規: 記事が属する話題の firstSeen が今日
 * - 続報: 上記以外で、記事が属する話題の dates に今日が含まれる
 * - 単発: どの話題の articleIds にも含まれない記事（ストーリー対象外トピック等）
 *
 * 1記事は必ずどれか1グループにのみ入る（story.articleIds に同じ記事が複数話題へ
 * 重複登録されることは無い前提。念のため最初に見つかった話題だけを採用する）。
 */
function classifyTodayArticles(stories, todayArticleIds, lastDate) {
  var storyByArticle = {};
  stories.forEach(function (s) {
    s.articleIds.forEach(function (id) {
      if (!(id in storyByArticle)) storyByArticle[id] = s;
    });
  });

  var groups = { new: [], continued: [], solo: [] };
  todayArticleIds.forEach(function (id) {
    var s = storyByArticle[id];
    if (!s) { groups.solo.push({ id: id }); return; }

    if (s.firstSeen === lastDate) {
      groups.new.push({ id: id, storyId: s.id, storyTitle: s.title });
      return;
    }

    var pastDates = s.dates.filter(function (d) { return d !== lastDate; });
    groups.continued.push({
      id: id,
      storyId: s.id,
      storyTitle: s.title,
      dayNumber: s.dates.indexOf(lastDate) + 1,
      gapDays: pastDates.length ? dayDiff(pastDates[pastDates.length - 1], lastDate) : null
    });
  });
  return groups;
}

/**
 * 話題の記事群を「今回の更新」「ここまでの経過（初出／前回／今回）」「根拠記事（全件・中間は折りたたみ）」
 * へ組み立てる。DOM に触れない純粋関数。固定データでのテストは story-narrative.test.mjs を参照。
 * 新しい要約は作らず、既存の記事要約と日付だけで決定的に組み立てる。
 *
 * - 記事1件: storyline は「初出」のみ（今回＝初出なので重複表示しない）
 * - 記事2件: storyline は「初出」「今回」（前回＝初出と同じなので省略）
 * - 記事3件以上: storyline は「初出」「前回」「今回」
 */
function buildStoryNarrative(articleIds, articleById) {
  var items = articleIds
    .map(function (id) { return articleById[id]; })
    .filter(Boolean)
    .sort(function (a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
  if (!items.length) return null;

  var first = items[0];
  var latest = items[items.length - 1];
  var prev = items.length >= 3 ? items[items.length - 2] : null;

  var storyline = [{ label: '初出', article: first }];
  if (prev && prev.id !== first.id) storyline.push({ label: '前回', article: prev });
  if (latest.id !== first.id) storyline.push({ label: '今回', article: latest });

  var evidenceVisible = items.length <= 5 ? items : [items[0]].concat(items.slice(-4));
  var evidenceCollapsed = items.length <= 5 ? [] : items.slice(1, -4);

  return {
    latest: latest,
    storyline: storyline,
    evidenceVisible: evidenceVisible,
    evidenceCollapsed: evidenceCollapsed,
    total: items.length
  };
}

/** 指定日を含む週の日曜日（JST）を ISO 日付で返す */
function weekStart(iso) {
  var d = new Date(iso + 'T12:00:00+09:00');
  d.setDate(d.getDate() - d.getDay());
  return d.toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' });
}

/**
 * 分野（トピック）ごとに直近 weekCount 週の記事数・前週比・トレンド記号を組み立てる。
 * DOM に触れない純粋関数。固定データでのテストは field-trends.test.mjs を参照。
 *
 * 週は日曜始まり（weekStart）。lastDate を含む週を最新週とし、そこから遡って weekCount 週ぶんを
 * 古い→新しい順で並べる。範囲外の日は無視するので、観測期間が weekCount 週に満たない「初週」でも
 * 単に古い週が0件のまま並ぶだけで壊れない。
 */
function buildFieldTrends(days, articles, topics, lastDate, weekCount) {
  weekCount = weekCount || 8;
  var articleById = {};
  articles.forEach(function (a) { articleById[a.id] = a; });

  var lastWeekStart = weekStart(lastDate);
  var weeks = [];
  for (var i = weekCount - 1; i >= 0; i--) {
    var d = new Date(lastWeekStart + 'T12:00:00+09:00');
    d.setDate(d.getDate() - i * 7);
    weeks.push(d.toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' }));
  }
  var weekIndex = {};
  weeks.forEach(function (w, i) { weekIndex[w] = i; });

  var counts = {};
  topics.forEach(function (t) { counts[t.id] = weeks.map(function () { return 0; }); });
  days.forEach(function (day) {
    var wi = weekIndex[weekStart(day.date)];
    if (wi === undefined) return;
    day.articleIds.forEach(function (id) {
      var a = articleById[id];
      if (a && counts[a.topic]) counts[a.topic][wi]++;
    });
  });

  return topics.map(function (t) {
    var weeklyCounts = counts[t.id];
    var thisWeek = weeklyCounts[weeklyCounts.length - 1];
    var lastWeek = weeklyCounts.length >= 2 ? weeklyCounts[weeklyCounts.length - 2] : 0;
    var delta = thisWeek - lastWeek;
    return {
      topicId: t.id,
      topicLabel: t.label,
      weeklyCounts: weeklyCounts,
      weekStarts: weeks,
      thisWeek: thisWeek,
      lastWeek: lastWeek,
      delta: delta,
      trend: delta > 0 ? 'up' : (delta < 0 ? 'down' : 'flat')
    };
  });
}

/** HTML特殊文字のエスケープ。IIFE内の esc() と同じ実装（トップレベルの純粋関数から独立して使うため複製） */
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

/** 検索語の一致箇所を <mark> で囲んでエスケープ済みHTMLを返す（大文字小文字は区別しない） */
function highlightMatch(text, query) {
  var s = String(text);
  if (!query) return escapeHtml(s);
  var idx = s.toLowerCase().indexOf(String(query).toLowerCase());
  if (idx === -1) return escapeHtml(s);
  return escapeHtml(s.slice(0, idx)) + '<mark>' + escapeHtml(s.slice(idx, idx + query.length)) + '</mark>' +
    escapeHtml(s.slice(idx + query.length));
}

/**
 * 検索語で記事を絞り込み、所属話題ごとにグルーピングしたうえで分野・期間・状態フィルターを適用する。
 * DOM に触れない純粋関数。固定データでのテストは search-result.test.mjs を参照。
 *
 * - 話題（story）に属する記事は、話題ごとに1グループへまとめる（同じ話題の記事を1件ずつ並べない）
 * - 話題に属さない記事は「単発記事」として個別に残す
 * - totalArticles / totalGroups はフィルター適用前の検索結果全体を示す（完了条件: 先頭に記事数と話題数）
 * - 状態フィルター（継続中／停止）が指定されているとき、単発記事はどちらにも該当しないため除外する
 */
function buildSearchResult(articles, stories, query, filters) {
  var q = String(query || '').trim();
  if (!q) return { query: '', totalArticles: 0, totalGroups: 0, groups: [], solos: [] };

  filters = filters || {};
  var lower = q.toLowerCase();
  var hits = articles.filter(function (a) {
    return (a.title + a.summary).toLowerCase().indexOf(lower) !== -1;
  });

  var storyByArticle = {};
  stories.forEach(function (s) {
    s.articleIds.forEach(function (id) {
      if (!(id in storyByArticle)) storyByArticle[id] = s;
    });
  });

  var groupMap = {};
  var soloHits = [];
  hits.forEach(function (a) {
    var s = storyByArticle[a.id];
    if (!s) { soloHits.push(a); return; }
    (groupMap[s.id] = groupMap[s.id] || { story: s, articles: [] }).articles.push(a);
  });

  var allGroups = Object.keys(groupMap).map(function (sid) {
    var g = groupMap[sid];
    var sorted = g.articles.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }); // 新しい順
    return {
      storyId: g.story.id,
      storyTitle: g.story.title,
      topic: g.story.topic,
      live: g.story.live,
      hitCount: sorted.length,
      firstHitDate: sorted[sorted.length - 1].date,
      lastHitDate: sorted[0].date,
      articleIds: sorted.map(function (a) { return a.id; }),
      sample: sorted[0]
    };
  });

  function withinPeriod(dateStr) {
    if (!filters.periodDays || !filters.today) return true;
    return dayDiff(dateStr, filters.today) <= filters.periodDays;
  }

  var groups = allGroups.filter(function (g) {
    if (filters.topic && g.topic !== filters.topic) return false;
    if (!withinPeriod(g.lastHitDate)) return false;
    if (filters.status && (filters.status === 'live') !== g.live) return false;
    return true;
  }).sort(function (a, b) { return a.lastHitDate < b.lastHitDate ? 1 : -1; });

  var solos = soloHits.filter(function (a) {
    if (filters.topic && a.topic !== filters.topic) return false;
    if (!withinPeriod(a.date)) return false;
    if (filters.status) return false;
    return true;
  }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });

  return {
    query: q,
    totalArticles: hits.length,
    totalGroups: allGroups.length,
    groups: groups,
    solos: solos
  };
}

    }

    $('gantt').innerHTML = movedToday.map(ganttRow).join('');
    $('gantt-dormant').innerHTML = dormant.map(ganttRow).join('');
    $('gantt-dormant-wrap').hidden = dormant.length === 0;
    $('gantt-dormant-n').textContent = dormant.length ? dormant.length + '件' : '';
  }

  function storyScore(s) {
    return s.articleIds.reduce(function (max, id) { return ART[id] ? Math.max(max, ART[id].score) : max; }, 0);
  }
  function storyHasUnread(s) {
    return s.articleIds.some(function (id) { return ART[id] && !isRead(id); });
  }

  /** きょう動いた話題が無い日に見せる代わり: 直近でいちばん長く続いている話題 */
  function fallbackLeadStory() {
    var cands = D.stories.filter(function (s) { return s.live && s.count >= 3; });
    return cands.sort(function (a, b) { return b.spanDays - a.spanDays; })[0] ||
      D.stories.slice().sort(function (a, b) { return b.count - a.count; })[0];
  }

  /** 今朝の要点: 1件目は状態＋見出し＋今回追加分の要約1文＋分野＋根拠記事数、2・3件目は状態＋見出しのみ */
  function renderHighlights(highlights) {
    if (!highlights.length) {
      $('highlights').innerHTML = '<li class="highlights-empty">' +
        'きょうは新しく動いた話題がありませんでした。下に直近でいちばん長く続いている話題を出します。</li>';
      return;
    }
    $('highlights').innerHTML = highlights.map(function (h, i) {
      var badgeClass = h.status === '新規' ? 'b-new' : 'b-cont';
      if (i === 0) {
        return '<li class="highlight lead" data-story="' + esc(h.id) + '" role="button" tabindex="0">' +
          '<span class="badge ' + badgeClass + '">' + h.status + '</span>' +
          '<b class="h-title">' + esc(h.title) + '</b>' +
          (h.summary ? '<p class="h-summary">' + esc(h.summary) + '</p>' : '') +
          '<div class="h-meta"><span>' + esc(TOPIC[h.topic] || h.topic) + '</span>' +
          '<span>根拠記事 <b>' + h.count + '件</b></span></div></li>';
      }
      return '<li class="highlight" data-story="' + esc(h.id) + '" role="button" tabindex="0">' +
        '<span class="badge ' + badgeClass + '">' + h.status + '</span>' +
        '<b class="h-title">' + esc(h.title) + '</b></li>';
    }).join('');
  }

  /** 話題を一面に出す（#34: 今回の更新 → ここまでの経過 → 根拠記事、の3層で構成する） */
  function showStory(s, kicker) {
    $('kicker').textContent = kicker;
    $('lead-title').textContent = s.title;
    $('lead-meta').innerHTML =
      '<span>初出 ' + s.firstSeen + '</span><span>直近 ' + s.lastSeen + '</span>' +
      '<span><b>' + s.spanDays + '日間</b></span><span>記事 <b>' + s.count + '件</b></span>' +
      '<span>' + esc(TOPIC[s.topic] || s.topic) + '</span><span>' + esc(s.kindLabel) + '</span>';

    var n = buildStoryNarrative(s.articleIds, ART);
    renderLatestUpdate(n);
    renderStoryline(n);
    renderEvidence(n);

    Array.prototype.forEach.call(document.querySelectorAll('.gantt tbody tr'), function (tr) {
      tr.setAttribute('aria-selected', String(tr.dataset.story === s.id));
    });
    // 選ばれた話題が「動きのない話題」側にあれば、開いて見えるようにする
    var dormantRow = $('gantt-dormant').querySelector('tr[data-story="' + CSS.escape(s.id) + '"]');
    if (dormantRow) $('gantt-dormant-wrap').open = true;
  }

  /** 層1: 今回の更新。公開日時（実測 rss／代用 delivered）の区別は published() をそのまま使う */
  function renderLatestUpdate(n) {
    if (!n) { $('latest-block').innerHTML = ''; return; }
    var a = n.latest;
    $('latest-block').innerHTML =
      '<span class="latest-label">今回の更新</span>' +
      '<div data-article="' + esc(a.id) + '"' + (isRead(a.id) ? ' class="read"' : '') + '>' +
      '<span class="latest-date">' + published(a) + (a.sourceName ? '　' + esc(a.sourceName) : '') + '</span>' +
      '<a class="latest-title" href="' + esc(a.url) + '" target="_blank" rel="noopener" data-read-id="' + esc(a.id) + '">' + esc(a.title) + '</a>' +
      '<p class="latest-summary">' + esc(a.summary) + '</p></div>';
  }

  /** 層2: ここまでの経過。初出／前回／今回をラベル付きで並べる（buildStoryNarrative が件数に応じて間引く） */
  function renderStoryline(n) {
    if (!n || !n.storyline.length) { $('storyline').innerHTML = ''; return; }
    $('storyline').innerHTML = n.storyline.map(function (pt) {
      var a = pt.article;
      return '<li data-article="' + esc(a.id) + '"' + (isRead(a.id) ? ' class="read"' : '') + '>' +
        '<span class="sl-label">' + esc(pt.label) + '</span>' +
        '<span class="sl-date">' + esc(a.date) + '</span>' +
        '<a class="sl-title" href="' + esc(a.url) + '" target="_blank" rel="noopener" data-read-id="' + esc(a.id) + '">' + esc(a.title) + '</a></li>';
    }).join('');
  }

  /** 層3: 根拠記事。全記事へ到達できるが、中間は既存どおり折りたたむ */
  function renderEvidence(n) {
    $('evidence-n').textContent = n ? n.total + '件' : '';
    if (!n) { $('lead-tl').innerHTML = '<li class="muted">記事が見つかりませんでした。</li>'; return; }
    $('lead-tl').innerHTML = n.evidenceVisible.map(timelineItem).join('') + (n.evidenceCollapsed.length
      ? '<li class="timeline-more"><details><summary>途中の経過 ' + n.evidenceCollapsed.length + '件を表示</summary><ul class="tl">' + n.evidenceCollapsed.map(timelineItem).join('') + '</ul></details></li>'
      : '');
  }

  function timelineItem(a) {
    return '<li data-article="' + esc(a.id) + '"' + (isRead(a.id) ? ' class="read"' : '') + '><span class="d">' + a.date +
      (a.sourceName ? '　' + esc(a.sourceName) : '') + '</span>' +
      '<a href="' + esc(a.url) + '" target="_blank" rel="noopener" data-read-id="' + esc(a.id) + '">' + esc(a.title) + '</a>' +
      '<span class="sm">' + esc(a.summary) + '</span></li>';
  }

  // 経過表・動いた話題からの選択
  document.addEventListener('click', function (e) {
    var paneButton = e.target.closest ? e.target.closest('[data-open-pane]') : null;
    if (paneButton) { show(paneButton.dataset.openPane); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    // #32: 状態別サマリーを押したら「今日」画面内の該当グループへ絞らず移動する
    var todayJump = e.target.closest ? e.target.closest('[data-today-jump]') : null;
    if (todayJump) {
      var target = $('today-group-' + todayJump.dataset.todayJump);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    var filter = e.target.closest ? e.target.closest('.filter-unread') : null;
    if (filter) {
      unreadOnly = !unreadOnly;
      if (activePane === 'archive' && currentArchiveDate) showDay(currentArchiveDate);
      else renderToday();
      return;
    }
    // #35: 分野の動向の並び替え
    var sortBtn = e.target.closest ? e.target.closest('[data-sort]') : null;
    if (sortBtn) {
      fieldSort = sortBtn.dataset.sort;
      Array.prototype.forEach.call(document.querySelectorAll('[data-sort]'), function (b) {
        b.setAttribute('aria-pressed', String(b === sortBtn));
      });
      renderFields(buildFieldTrends(D.days, D.articles, D.topics, D.lastDate, 8));
      return;
    }
    // #36: 検索結果の分野・期間・状態フィルター（各グループの「すべて」ボタンで1操作で解除できる）
    var filterBtn = e.target.closest ? e.target.closest('.filter-group button') : null;
    if (filterBtn) {
      var group = filterBtn.closest('.filter-group');
      var key = group.dataset.filter;
      var value = filterBtn.dataset.value;
      if (key === 'period') searchFilters.periodDays = value ? Number(value) : null;
      else if (key === 'topic') searchFilters.topic = value;
      else if (key === 'status') searchFilters.status = value;
      Array.prototype.forEach.call(group.querySelectorAll('button'), function (b) {
        b.setAttribute('aria-pressed', String(b === filterBtn));
      });
      runSearch();
      return;
    }
    var articleLink = e.target.closest ? e.target.closest('[data-read-id]') : null;
    if (articleLink) markRead(articleLink.dataset.readId);
    // #35: 分野を選ぶと、同一画面内にその分野の直近記事を出す
    var fieldEl = e.target.closest ? e.target.closest('[data-topic]') : null;
    if (fieldEl) { renderFieldArticles(fieldEl.dataset.topic); return; }
    var el = e.target.closest ? e.target.closest('[data-story]') : null;
    if (!el || !D) return;
    var s = D.stories.filter(function (x) { return x.id === el.dataset.story; })[0];
    if (!s) return;
    show('flow');
    showStory(s, s.live ? '追っている流れ' : '止まっている流れ');
    // #33: 選択直後にトップへ戻すのではなく、更新された詳細見出しへスクロール・フォーカスする
    $('lead-title').scrollIntoView({ behavior: 'smooth', block: 'start' });
    $('lead-title').focus({ preventScroll: true });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var el = e.target.closest ? e.target.closest('[data-story], [data-topic]') : null;
    if (!el) return;
    e.preventDefault(); el.click();
  });

  /** 発行元。取れていない記事には何も出さない（「不明」を並べても情報が増えない） */
  function source(a) {
    return a.sourceName ? '<span class="src">' + esc(a.sourceName) + '</span>' : '';
  }
  /**
   * 公開日時。実測（rss）と、取れなくて紙面掲載日で代用したもの（delivered）を区別する。
   * 推測値を実測値と同じ顔で並べない
   */
  function published(a) {
    if (!a.publishedAt) return a.date;
    var d = new Date(a.publishedAt);
    var s = d.toLocaleString('ja-JP', {
      timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit',
    });
    return a.publishedAtSource === 'rss'
      ? s + ' 公開'
      : '<span title="公開日時が取れなかったので紙面に載った日で代用">' + a.date + ' 掲載</span>';
  }

  // ── 記事リストの共通描画
  function artList(ids, expandTop) {
    var items = ids.map(function (id) { return ART[id]; }).filter(Boolean)
      .sort(function (a, b) { return b.score - a.score; });
    if (unreadOnly) items = items.filter(function (a) { return !isRead(a.id); });
    if (!items.length) return '<li class="muted">' + (unreadOnly ? '未読の記事はありません。' : '記事がありません。') + '</li>';
    return items.map(function (a, i) { return articleItem(a, Boolean(expandTop && i < 3), true); }).join('');
  }

  var STORY_STATUS_BADGE = { new: 'b-new', continued: 'b-cont', solo: 'b-solo' };
  var STORY_STATUS_LABEL = { new: '新規', continued: '続報', solo: '単発' };

  /**
   * #32: 今日の記事へ「新規／続報／単発」の状態と所属話題名を付ける（今日画面だけで使う）。
   * 新規は話題名が記事見出しとほぼ同一になりがちなので、バッジのみにして重複を避ける（#33）。
   */
  function storyMetaLine(meta) {
    if (!meta) return '';
    var note = '';
    if (meta.status === 'continued') {
      note = meta.dayNumber + '日目';
      if (meta.gapDays) note += '　前回から' + meta.gapDays + '日ぶり';
    }
    var showTitle = meta.status !== 'new' && meta.storyTitle;
    return '<div class="art-story"><span class="badge ' + STORY_STATUS_BADGE[meta.status] + '">' +
      STORY_STATUS_LABEL[meta.status] + '</span>' +
      (showTitle ? '<span class="art-story-title">' + esc(meta.storyTitle) + '</span>' : '') +
      (note ? '<span class="art-story-note">' + esc(note) + '</span>' : '') + '</div>';
  }

  /**
   * #33: 今日画面では要約（＝今回の更新）を開閉なしで常時見せる。アーカイブ・検索では
   * 従来どおり details の開閉に入れたまま（一覧の密度を優先するため）。
   */
  function articleItem(a, open, withImportance, storyMeta, previewSummary) {
      var body = previewSummary
        ? '<p class="art-preview">' + esc(a.summary) + '</p><div class="article-actions"><a href="' + esc(a.url) +
          '" target="_blank" rel="noopener" data-read-id="' + esc(a.id) + '">元記事を開く</a></div>'
        : '<details class="article-detail"' + (open ? ' open' : '') + '><summary><span>記事の要点</span>' +
          '<span class="summary-state when-closed">タップして表示</span><span class="summary-state when-open">表示中</span></summary>' +
          '<div class="summary-body"><div class="s">' + esc(a.summary) + '</div><div class="article-actions"><a href="' + esc(a.url) +
          '" target="_blank" rel="noopener" data-read-id="' + esc(a.id) + '">元記事を開く</a></div></div></details>';
      return '<li data-article="' + esc(a.id) + '"' + (isRead(a.id) ? ' class="read"' : '') + '>' +
        storyMetaLine(storyMeta) + '<div class="h">' +
        (isRead(a.id) ? '' : '<span class="unread-dot" aria-label="未読"></span>') + esc(a.title) + '</div>' +
        '<div class="m"><span class="tp">' + esc(TOPIC[a.topic] || a.topic) + '</span>' +
        source(a) + (withImportance ? '重要度 ' + '●'.repeat(a.score) + '○'.repeat(Math.max(0, 5 - a.score)) + '　' : '') +
        published(a) + '</div>' + body + '</li>';
  }

  var TODAY_GROUP_TITLE = { new: '新しく発見した話題', continued: '続報', solo: 'その他の注目' };

  /** #32/#33: 分類済みグループ1件分を記事リストへ（重要度順・未読フィルタ込み。要約は開閉なしで常時表示） */
  function todayGroupList(items, meta) {
    var withArticle = items.map(function (it) { return { article: ART[it.id], meta: meta(it) }; })
      .filter(function (x) { return x.article; })
      .sort(function (x, y) { return y.article.score - x.article.score; });
    var visible = unreadOnly ? withArticle.filter(function (x) { return !isRead(x.article.id); }) : withArticle;
    if (!visible.length) return '<li class="muted">' + (unreadOnly ? '未読の記事はありません。' : '記事がありません。') + '</li>';
    return visible.map(function (x) { return articleItem(x.article, false, true, x.meta, true); }).join('');
  }

  function todayGroupSection(key, items) {
    return '<h2 class="sec" id="today-group-' + key + '">' + TODAY_GROUP_TITLE[key] + ' <small>' + items.length + '件</small></h2>' +
      '<ul class="arts">' + todayGroupList(items, function (it) {
        return { status: key, storyTitle: it.storyTitle, dayNumber: it.dayNumber, gapDays: it.gapDays };
      }) + '</ul>';
  }

  // ── 今日の紙面（#32: 今日の記事を新規／続報／単発へ一度だけ分類して見せる）
  function renderToday() {
    var d = D.days[D.days.length - 1];
    if (!d) { $('p-today').innerHTML = '<div class="muted">まだありません。</div>'; return; }
    var groups = classifyTodayArticles(D.stories, d.articleIds, D.lastDate);
    var summary = '<div class="today-summary" aria-label="今日の変化">' +
      '<button type="button" data-today-jump="new">新しく発見<b>' + groups.new.length + '件</b></button>' +
      '<button type="button" data-today-jump="continued">続報あり<b>' + groups.continued.length + '件</b></button>' +
      '<button type="button" data-today-jump="solo">その他の注目<b>' + groups.solo.length + '件</b></button></div>';
    $('p-today').innerHTML = '<h2 class="sec">' + jp(d.date) + ' <small>' + d.articleIds.length +
      '件・重要度順</small></h2>' + summary + '<div class="list-tools"><button class="filter-unread" type="button" aria-pressed="' + unreadOnly + '">未読だけ</button></div>' +
      todayGroupSection('new', groups.new) + todayGroupSection('continued', groups.continued) + todayGroupSection('solo', groups.solo);
  }

  // ── アーカイブ（月 → 日 の2段。1年分でも日のボタンが31個で収まる）
  function renderArchive() {
    var days = D.days.slice().reverse();
    if (!days.length) { $('archive-body').innerHTML = '<div class="muted">まだありません。</div>'; return; }

    var months = [];
    days.forEach(function (d) {
      var m = d.date.slice(0, 7);
      if (months.indexOf(m) === -1) months.push(m);
    });

    $('monthbar').innerHTML = months.map(function (m, i) {
      return '<button data-month="' + m + '" aria-selected="' + (i === 0) + '">' +
        m.slice(0, 4) + '年' + Number(m.slice(5, 7)) + '月</button>';
    }).join('');
    $('monthbar').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      select($('monthbar'), b);
      showMonth(b.dataset.month);
    });
    $('daybar').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      select($('daybar'), b);
      showDay(b.dataset.day);
    });

    showMonth(months[0]);

    function showMonth(m) {
      var inMonth = days.filter(function (d) { return d.date.slice(0, 7) === m; });
      $('daybar').innerHTML = inMonth.map(function (d, i) {
        return '<button data-day="' + d.date + '" aria-selected="' + (i === 0) + '">' +
          Number(d.date.slice(8, 10)) + '日</button>';
      }).join('');
      if (inMonth[0]) showDay(inMonth[0].date);
    }
  }
  function select(bar, btn) {
    Array.prototype.forEach.call(bar.querySelectorAll('button'), function (x) {
      x.setAttribute('aria-selected', String(x === btn));
    });
  }
  function showDay(date) {
    var d = D.days.filter(function (x) { return x.date === date; })[0];
    if (!d) return;
    currentArchiveDate = date;
    $('archive-body').innerHTML = '<h2 class="sec">' + jp(d.date) + ' <small>' + d.articleIds.length +
      '件</small></h2><div class="list-tools"><button class="filter-unread" type="button" aria-pressed="' + unreadOnly + '">未読だけ</button></div>' +
      '<ul class="arts">' + artList(d.articleIds, false) + '</ul>';
  }

  // ── 分野の動向（#35: 直近8週の週次件数・前週比・8週スパークライン）
  var fieldSort = 'delta';

  function renderTerrain() {
    renderFields(buildFieldTrends(D.days, D.articles, D.topics, D.lastDate, 8));
    $('field-articles').innerHTML = '';
  }

  function renderFields(trends) {
    var sorted = trends.slice().sort(function (a, b) {
      return fieldSort === 'thisWeek' ? b.thisWeek - a.thisWeek : b.delta - a.delta;
    });
    var max = 1;
    trends.forEach(function (t) { t.weeklyCounts.forEach(function (v) { if (v > max) max = v; }); });
    $('fields').innerHTML = sorted.map(function (t) { return fieldItem(t, max); }).join('');
  }

  function fieldItem(t, max) {
    var arrow = t.trend === 'up' ? '↑' : (t.trend === 'down' ? '↓' : '→');
    var deltaLabel = t.delta > 0 ? '+' + t.delta : String(t.delta);
    var bars = t.weeklyCounts.map(function (v, i) {
      var h = Math.max(2, Math.round(24 * v / max));
      var isNow = i === t.weeklyCounts.length - 1;
      return '<span class="spark-bar' + (isNow ? ' spark-now' : '') + '" style="height:' + h + 'px" ' +
        'title="' + esc(t.weekStarts[i]) + 'の週　' + v + '件"></span>';
    }).join('');
    return '<li class="field" data-topic="' + esc(t.topicId) + '" role="button" tabindex="0">' +
      '<div class="field-head"><span class="field-label">' + esc(t.topicLabel) + '</span>' +
      '<span class="field-trend trend-' + t.trend + '">' + arrow + ' ' + deltaLabel + '</span></div>' +
      '<div class="field-numbers">今週 <b>' + t.thisWeek + '件</b>　前週 ' + t.lastWeek + '件</div>' +
      '<div class="sparkline">' + bars + '</div></li>';
  }

  /** 分野選択後の対象記事を同一画面（地形タブ）内に出す（#35） */
  function renderFieldArticles(topicId) {
    var ids = D.articles.filter(function (a) { return a.topic === topicId; })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; })
      .slice(0, 10)
      .map(function (a) { return a.id; });
    $('field-articles').innerHTML = '<h2 class="sec">' + esc(TOPIC[topicId] || topicId) + 'の直近記事 <small>' + ids.length + '件</small></h2>' +
      '<ul class="arts">' + artList(ids, false) + '</ul>';
    $('field-articles').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── 全文検索（#36: 話題単位にグルーピングし、分野・期間・状態で絞り込む）
  var timer = null;
  var currentQuery = '';
  var searchFilters = { topic: '', periodDays: null, status: '' };

  [$('q'), $('q-mobile')].forEach(function (input) {
    input.addEventListener('input', function () {
      var other = input === $('q') ? $('q-mobile') : $('q');
      other.value = input.value;
      clearTimeout(timer);
      timer = setTimeout(runSearch, 120);
    });
  });

  function ensureTopicFilterOptions() {
    var container = $('filter-topic');
    if (container.dataset.built) return;
    container.dataset.built = '1';
    container.innerHTML = '<span class="filter-label">分野</span><button type="button" data-value="" aria-pressed="true">すべて</button>' +
      D.topics.map(function (t) {
        return '<button type="button" data-value="' + esc(t.id) + '" aria-pressed="false">' + esc(t.label) + '</button>';
      }).join('');
  }

  function renderSearchGroup(g) {
    return '<li class="search-group" data-story="' + esc(g.storyId) + '" role="button" tabindex="0">' +
      '<span class="badge ' + (g.live ? 'b-cont' : 'b-end') + '">' + (g.live ? '継続中' : '停止') + '</span>' +
      '<b class="sg-title">' + esc(g.storyTitle) + '</b>' +
      '<div class="sg-meta">' + esc(TOPIC[g.topic] || g.topic) + '　ヒット ' + g.hitCount + '件　' +
      esc(g.firstHitDate) + '〜' + esc(g.lastHitDate) + '</div>' +
      '<div class="sg-sample">' + highlightMatch(g.sample.title, currentQuery) + '</div></li>';
  }

  function runSearch() {
    var q = ($('q-mobile').value || $('q').value).trim();
    currentQuery = q;
    if (!D) return;
    if (!q) {
      $('search-n').textContent = '';
      $('search-filters').hidden = true;
      $('search-groups').innerHTML = '<li class="muted">検索語を入力してください。</li>';
      $('search-solos').innerHTML = '';
      show('search');
      return;
    }
    ensureTopicFilterOptions();
    var filters = { topic: searchFilters.topic, periodDays: searchFilters.periodDays, status: searchFilters.status, today: D.lastDate };
    var result = buildSearchResult(D.articles, D.stories, q, filters);

    $('search-n').textContent = result.totalArticles + '件・' + result.totalGroups + '話題';
    $('search-filters').hidden = false;

    if (!result.groups.length && !result.solos.length) {
      $('search-groups').innerHTML = '<li class="muted">見つかりませんでした。</li>';
      $('search-solos').innerHTML = '';
    } else {
      $('search-groups').innerHTML = result.groups.map(renderSearchGroup).join('');
      $('search-solos').innerHTML = result.solos.length
        ? '<h3 class="search-solo-heading">単発記事 <small>' + result.solos.length + '件</small></h3>' +
          '<ul class="arts">' + result.solos.map(function (a) { return articleItem(a, false, false); }).join('') + '</ul>'
        : '';
    }
    show('search');
  }
})();
</script>
</body>
</html>
